<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your QR · RetainOS</title>
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script src="sb.js"></script>
</head>
<body>
<header class="top noprint">
  <a class="logo" href="dashboard.html">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M79.34 43.76 A30 30 0 1 1 45.82 20.29" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/><path d="M60.68 18.20 L44.15 8.41 L47.49 32.18 Z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="72.98" cy="30.72" r="11" fill="currentColor"/></svg>
    <span>Retain<b>OS</b></span>
  </a>
  <a class="chip" href="dashboard.html" id="back"></a>
</header>

<main class="wrap">
  <div class="noprint">
    <h1 id="h1" style="font-size:28px;margin:6px 0 4px"></h1>
    <p class="hint" id="sub"></p>

    <label class="label" for="shopSel" id="lShop"></label>
    <select id="shopSel" style="max-width:420px"></select>

    <div class="card" style="margin-top:16px">
      <b id="lJoin"></b>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <input id="joinUrl" type="text" readonly style="flex:1 1 260px">
        <button class="btn ghost" id="copy" style="min-height:52px"></button>
      </div>
      <p class="hint" id="joinNote"></p>
    </div>

    <p class="hint" id="printHint" style="margin-top:18px"></p>
    <button class="btn" id="print"></button>
  </div>

  <div style="margin-top:24px">
    <div class="poster">
      <div style="display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px">
        <span id="badge" style="width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:17px">·</span>
        <span id="posterShop" style="font-family:'Bricolage Grotesque';font-weight:800;font-size:22px"></span>
      </div>
      <h2 id="posterHead" style="font-size:23px"></h2>
      <p class="hint" id="posterSub"></p>
      <img id="qr" alt="Shop QR code">
      <div class="step" id="posterStep"></div>
    </div>
  </div>
  <p class="foot noprint" id="foot"></p>
</main>

<script src="onboard.js"></script>
</body>
</html>
