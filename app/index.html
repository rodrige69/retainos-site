<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RetainOS</title>
<script>
(function () {
  var join = location.hostname.indexOf("join.") === 0;
  /* Keep the fragment: an email link that failed arrives as #error=..., and
     dropping it left people on the sign-in form with no explanation. */
  location.replace((join ? "join.html" : "signin.html") + (location.hash || ""));
})();
</script>
</head>
<body></body>
</html>
