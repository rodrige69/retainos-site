<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FCF9F3">
<title>RetainOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="client-theme.css">
<link rel="stylesheet" href="shop-theme.css">
<script src="config.js"></script>
<script src="sb.js"></script>
</head>
<body>
<main class="wrap narrow" style="padding-top:22px">
  <div class="langs"><button type="button" id="en" class="on">EN</button><button type="button" id="es">ES</button></div>
  <div class="card" id="page" hidden>
    <div class="shophead">
      <span id="badge">·</span>
      <h1 id="shopName"></h1>
      <p id="shopType" class="kind"></p>
      <p id="where" class="where"></p>
    </div>

    <a class="btn block" id="book" target="_blank" rel="noopener" hidden></a>
    <a class="btn block ghost" id="join"></a>
    <p class="hint center" id="joinNote"></p>

    <div id="promo" class="hidden"></div>

    <div class="hoursbox" id="hoursBox" hidden></div>

    <div class="reach" id="reach"></div>
  </div>
  <div class="card" id="broken" hidden>
    <h1 id="brokenH"></h1>
    <p class="hint" id="brokenP"></p>
  </div>
  <p class="foot" id="foot"></p>
</main>
<script src="brand.js"></script>
<script src="promo-widget.js"></script>
<script src="shop.js"></script>
</body>
</html>
