<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FCF9F3">
<title>Perks & Rewards · RetainOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

    <div style="display:flex;gap:6px">

  <p class="hint" id="sub"></p>
  <div class="ptabs" id="ptabs"></div>
  <div class="card" id="scope"></div>
  <div id="sections"></div>
  <div class="msg" id="msg" role="status" style="margin-top:12px"></div>
  <button class="btn" id="save" type="button" style="width:100%;margin-top:14px"></button>
