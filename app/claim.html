<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17191C">
<title>Your reward · RetainOS</title>
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script src="sb.js"></script>
</head>
<body>
<div class="demo hidden" id="demoNote"></div>

<main class="wrap narrow" style="padding-top:26px">
  <div class="card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">
      <span id="badge" style="width:44px;height:44px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:19px">·</span>
      <div><b id="shopName" style="font-size:18px">&nbsp;</b><br><small id="shopMeta" class="hint"></small></div>
    </div>

    <!-- no code in the link: let them type the one from the message -->
    <div id="askBlock" class="hidden">
      <h1 id="askH" style="font-size:25px;margin-top:10px"></h1>
      <p class="hint" id="askP"></p>
      <label class="label" id="lCode" for="codeInput"></label>
      <input id="codeInput" type="text" autocapitalize="characters" autocomplete="off" placeholder="A1B2C3D4E5">
      <button class="btn block" id="lookup"></button>
    </div>

    <!-- a real reward -->
    <div id="okBlock" class="hidden">
      <h1 id="okH" style="font-size:26px;margin-top:10px"></h1>
      <p class="hint" id="okSub"></p>
      <div class="voucher" id="voucher"></div>
      <p class="hint" id="okExpiry"></p>
      <p class="note" id="okHow"></p>
      <p class="hint" id="okOptOut"></p>
    </div>

    <!-- used, expired or unknown -->
    <div id="badBlock" class="hidden">
      <h1 id="badH" style="font-size:24px;margin-top:10px"></h1>
      <p class="hint" id="badP"></p>
      <div class="msg bad" id="badMsg"></div>
    </div>

    <div class="msg hidden" id="msg"></div>
  </div>
  <p class="foot" id="foot"></p>
</main>

<script src="claim.js"></script>
</body>
</html>
