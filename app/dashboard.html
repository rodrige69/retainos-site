<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · RetainOS</title>
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script src="sb.js"></script>
</head>
<body>
<div class="demo hidden" id="demoNote"></div>
<header class="top">
  <span class="logo">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M79.34 43.76 A30 30 0 1 1 45.82 20.29" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/><path d="M60.68 18.20 L44.15 8.41 L47.49 32.18 Z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="72.98" cy="30.72" r="11" fill="currentColor"/></svg>
    <span>Retain<b>OS</b></span>
  </span>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="btnEn">EN</button><button type="button" id="btnEs">ES</button>
    </div>
    <a class="chip" href="onboard.html" id="qrLink"></a>
    <a class="chip" href="promo" id="promoLink"></a>
    <a class="chip hidden" href="admin" id="adminLink"></a>
    <button class="chip" id="signout"></button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div>
      <p class="heroDate" id="today"></p>
      <h1 id="greet"></h1>
      <p class="heroPlan" id="plan"></p>
      <div class="heroBig">
        <b id="heroDue">0</b>
        <span id="heroDueK"></span>
      </div>
    </div>
    <div class="heroSide">
      <p class="meterLabel" id="meterLabel"></p>
      <div class="meter"><i id="meterFill" style="width:0%"></i></div>
      <p class="meterNote" id="meterNote"></p>
    </div>
  </section>

  <div class="msg info hidden" id="loadNote" role="status"></div>

  <div class="kpis" id="kpis"></div>

  <section class="card hidden" id="shareCard" style="margin-top:18px">
    <h2 class="sec" id="shareH" style="margin-top:0"></h2>
    <p class="hint" id="shareSub"></p>

    <div id="bookingRow">
      <label class="label" id="lBooking" for="bookingUrl"></label>
      <div class="linkbox" id="bookingView">
        <input id="bookingUrl" type="text" readonly>
        <button class="btn" id="bookingShare" type="button"></button>
      </div>
      <div class="linkbox hidden" id="bookingEdit">
        <input id="bookingInput" type="text" autocapitalize="none" spellcheck="false" placeholder="https://booksy.com/yourshop">
        <button class="btn" id="bookingSave" type="button"></button>
      </div>
      <button class="linkbtn hidden" id="bookingChange" type="button"></button>
      <p class="hint" id="bookingNote"></p>
    </div>

    <label class="label" id="lPay" for="payUrl"></label>
    <div class="linkbox" id="payRow">
      <input id="payUrl" type="text" readonly>
      <button class="btn" id="payShare" type="button"></button>
    </div>
    <div class="linkbox" id="payEdit">
      <input id="payInput" type="text" autocapitalize="none" spellcheck="false" placeholder="https://venmo.com/yourname">
      <button class="btn" id="paySave" type="button"></button>
    </div>
    <p class="hint" id="payNote"></p>
  </section>

  <div class="cols">
    <section>
      <h2 class="sec" id="dueH"></h2>
      <p class="hint" id="dueSub"></p>
      <div class="list" id="dueList"></div>
    </section>
    <aside>
      <h2 class="sec" id="insightH"></h2>
      <p class="hint" id="insightSub"></p>
      <div class="list" id="insights"></div>
      <h2 class="sec" id="rewardsH" style="margin-top:24px"></h2>
      <div class="list" id="rewardList"></div>
    </aside>
  </div>

  <h2 class="sec" id="recentH" style="margin-top:26px"></h2>
  <div class="list" id="recentList"></div>

  <h2 class="sec" id="refH" style="margin-top:26px"></h2>
  <div class="list" id="refList"></div>

  <div class="msg hidden" id="msg"></div>
</main>

<script src="dashboard.js"></script>
</body>
</html>
