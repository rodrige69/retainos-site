<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FCF9F3">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rewards">
<title>Join the rewards club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="client-theme.css">
<script src="config.js"></script>
<script src="sb.js"></script>
</head>
<body>
<div class="demo hidden" id="demoNote"></div>

<main class="wrap narrow" style="padding-top:26px">
  <div class="card">
    <div id="shopHead" style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <span id="badge" style="width:44px;height:44px;border-radius:13px">·</span>
      <div><b id="shopName" style="font-size:18px">&nbsp;</b><br><small id="shopMeta" class="hint"></small></div>
    </div>

    <div id="form">
      <h1 id="h1" style="font-size:25px;margin-top:10px"></h1>
      <p class="hint" id="sub"></p>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <label class="label" id="lFirst" for="first"></label>
          <input id="first" type="text" autocomplete="given-name" placeholder="David">
        </div>
        <div>
          <label class="label" id="lLast" for="last"></label>
          <input id="last" type="text" autocomplete="family-name" placeholder="Ross">
        </div>
      </div>

      <label class="label" id="lPhone" for="phone"></label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(305) 555-0142">

      <label class="label" id="lEmail" for="email"></label>
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com">

      <label class="consent"><input type="checkbox" id="consent"><span id="consentText"></span></label>
      <p class="hint" id="startNote"></p>
      <button class="btn block" id="join"></button>
      <p class="hint" id="fine"></p>
      <div class="msg hidden" id="msg"></div>
    </div>

    <div id="card" class="hidden">
      <h1 id="cardHi" style="font-size:25px;margin-top:8px"></h1>
      <p class="hint" id="cardSub"></p>
      <div class="stamps" id="stampRow"></div>
      <p class="hint" id="cardNext"></p>
      <button class="btn block ghost" id="qrBtn" type="button"></button>
      <div id="qrBox" class="hidden" style="text-align:center;margin-top:14px">
        <div id="qrSvg" style="width:260px;max-width:100%;margin:0 auto;background:#fff;padding:10px;border:1px solid var(--line);border-radius:14px"></div>
        <p class="hint" id="qrNote"></p>
      </div>
      <label class="label" id="linkLbl" for="cardUrl"></label>
      <div class="linkbox">
        <input id="cardUrl" type="text" readonly>
        <button class="btn" id="copy" type="button"></button>
      </div>
      <p class="hint" id="cardNote"></p>
      <button class="btn block" id="doneBtn" type="button" style="margin-top:14px"></button>
      <p class="hint" id="doneMsg"></p>
      <button class="btn block ghost" id="notYou" type="button"></button>
      <div id="refBox" class="hidden">
        <label class="label" id="refLbl" for="refUrl"></label>
        <div class="linkbox">
          <input id="refUrl" type="text" readonly>
          <button class="btn" id="refCopy" type="button"></button>
        </div>
        <p class="hint" id="refNote"></p>
      </div>
      <div id="promo" class="hidden"></div>
    </div>

    <div id="broken" class="hidden">
      <h1 style="font-size:23px" id="brokenH"></h1>
      <p class="hint" id="brokenP"></p>
    </div>
  </div>
  <p class="foot" id="foot"></p>
</main>

<script src="brand.js"></script>
<script src="promo-widget.js"></script>
<script src="join.js"></script>
<script src="pwa.js"></script>
</body>
</html>
