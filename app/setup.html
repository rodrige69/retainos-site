<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up a shop · RetainOS</title>
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script src="sb.js"></script>
</head>
<body>
<header class="top">
  <a class="logo" href="dashboard.html">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M79.34 43.76 A30 30 0 1 1 45.82 20.29" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/><path d="M60.68 18.20 L44.15 8.41 L47.49 32.18 Z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="72.98" cy="30.72" r="11" fill="currentColor"/></svg>
    <span>Retain<b>OS</b></span>
  </a>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="lang">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="es">ES</button>
    </div>
    <a class="chip" href="dashboard.html" id="back"></a>
  </div>
</header>

<main class="wrap" style="max-width:760px">
  <h1 id="h1" style="font-size:28px;margin:6px 0 4px"></h1>
  <p class="hint" id="sub" style="margin-bottom:20px"></p>

  <div class="card">
    <h2 style="font-size:19px" id="s1"></h2>
    <p class="hint" id="s1note"></p>

    <label class="label" for="name" id="lName"></label>
    <input id="name" type="text" autocomplete="organization">

    <label class="label" for="slug" id="lSlug"></label>
    <input id="slug" type="text" autocapitalize="none" spellcheck="false">
    <p class="hint" id="slugNote"></p>

    <label class="label" for="type" id="lType"></label>
    <select id="type"></select>
    <p class="hint" id="typeNote"></p>

    <label class="label" for="city" id="lCity"></label>
    <input id="city" type="text">
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="flex:1 1 120px">
        <label class="label" for="state" id="lState"></label>
        <input id="state" type="text" maxlength="2" autocapitalize="characters">
      </div>
      <div style="flex:1 1 120px">
        <label class="label" for="zip" id="lZip"></label>
        <input id="zip" type="text" inputmode="numeric" maxlength="10">
      </div>
    </div>

    <label class="label" for="phone" id="lPhone"></label>
    <input id="phone" type="tel">
  </div>

  <div class="card" style="margin-top:16px">
    <h2 style="font-size:19px" id="s2"></h2>
    <p class="hint" id="s2note"></p>

    <label class="label" for="lang" id="lLang"></label>
    <select id="lang">
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>

    <label class="label" for="plan" id="lPlan"></label>
    <select id="plan">
      <option value="regulars">Regulars · $39</option>
      <option value="full_book">Full Book · $79</option>
      <option value="hands_off">Hands-Off · $149</option>
    </select>

    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="flex:1 1 120px">
        <label class="label" for="start" id="lStart"></label>
        <input id="start" type="text" inputmode="numeric">
      </div>
      <div style="flex:1 1 120px">
        <label class="label" for="milestone" id="lMile"></label>
        <input id="milestone" type="text" inputmode="numeric">
      </div>
      <div style="flex:1 1 120px">
        <label class="label" for="texts" id="lTexts"></label>
        <input id="texts" type="text" inputmode="numeric">
      </div>
    </div>
    <p class="hint" id="mileNote"></p>

    <label class="label" for="tier" id="lTier"></label>
    <select id="tier">
      <option value="domestic">US getaways</option>
      <option value="international">US + international</option>
    </select>

    <label class="label" for="bookingTool" id="lTool"></label>
    <select id="bookingTool">
      <option value="">—</option>
      <option value="booksy">Booksy</option>
      <option value="square">Square</option>
      <option value="glossgenius">GlossGenius</option>
      <option value="vagaro">Vagaro</option>
      <option value="squire">Squire</option>
      <option value="votel">Votel</option>
      <option value="phone_text">Phone / text only</option>
    </select>

    <label class="label" for="bookingLink" id="lLink"></label>
    <input id="bookingLink" type="text" autocapitalize="none" spellcheck="false">
  </div>

  <div class="card" style="margin-top:16px">
    <h2 style="font-size:19px" id="s3"></h2>
    <p class="hint" id="s3note"></p>

    <label class="label" for="staff" id="lStaff"></label>
    <textarea id="staff" rows="4" style="width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fff"></textarea>

    <label class="label" for="owners" id="lOwners"></label>
    <input id="owners" type="text" autocapitalize="none" spellcheck="false">
    <p class="hint" id="ownersNote"></p>
  </div>

  <button class="btn block" id="submit"></button>
  <div class="msg hidden" id="msg"></div>

  <div class="card hidden" id="result" style="margin-top:18px">
    <h2 style="font-size:19px" id="rH"></h2>
    <div id="rBody" style="margin-top:10px"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      <input id="joinUrl" type="text" readonly style="flex:1 1 240px">
      <button class="btn ghost" id="copy" style="min-height:52px"></button>
    </div>
    <p class="hint" id="rNote"></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      <a class="btn" href="onboard.html" id="rQr"></a>
      <a class="btn ghost" href="dashboard.html" id="rDash"></a>
    </div>
  </div>

  <p class="foot" id="foot"></p>
</main>
<script src="setup.js"></script>
</body>
</html>
