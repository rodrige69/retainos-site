<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log a visit · RetainOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="client-theme.css">
<link rel="stylesheet" href="staff-theme.css">
<link rel="stylesheet" href="dashboard-theme.css">
<script src="config.js"></script>
<script src="sb.js"></script>
</head>
<body>
<div class="demo hidden" id="demoNote"></div>
<header class="top">
  <span class="logo">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M79.34 43.76 A30 30 0 1 1 45.82 20.29" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/><path d="M60.68 18.20 L44.15 8.41 L47.49 32.18 Z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="72.98" cy="30.72" r="11" fill="currentColor"/></svg>
    <span>Retain<b>OS</b></span>
  </span>
  <span class="shopchip"><i class="dot"></i><span id="shopChip">·</span></span>
</header>

<main class="wrap narrow">
  <div class="card">
    <h1 id="h1"></h1>
    <p class="hint" id="sub"></p>

    <div id="shopPick" class="hidden">
      <label class="label" id="lShop" for="shopSel"></label>
      <select id="shopSel"></select>
    </div>

    <div id="form">
      <label class="label" id="lPin"></label>
      <div class="slots" id="slots"><i></i><i></i><i></i><i></i></div>
      <div class="pinpad" id="pad"></div>

      <label class="label" id="lType"></label>
      <div id="types">
        <span class="chip" data-type="appointment" aria-pressed="true"></span>
        <span class="chip" data-type="walk_in" aria-pressed="false"></span>
        <span class="chip" data-type="product" aria-pressed="false"></span>
        <span class="chip" data-type="other" aria-pressed="false"></span>
      </div>


      <button class="btn block" id="scanBtn" type="button"></button>
      <p class="hint" id="scanHint"></p>

      <div id="scanBox" class="hidden" style="margin-top:14px">
        <video id="scanVideo" playsinline muted style="width:100%;border-radius:14px;background:#000"></video>
        <canvas id="scanCanvas" class="hidden"></canvas>
        <p class="hint" id="scanPoint"></p>
        <button class="btn block ghost" id="scanCancel" type="button"></button>
      </div>

      <div id="confirmBox" class="hidden" style="margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:14px">
        <b id="confirmWho" style="font-size:20px"></b>
        <div class="hint" id="confirmPhone" style="margin:2px 0 8px"></div>
        <div class="stamps" id="confirmStamps"></div>
        <p class="hint" id="confirmNote"></p>
        <button class="btn block" id="confirmBtn" type="button"></button>
        <button class="btn block" id="ovReqBtn" type="button"></button>
        <div id="ovBox" class="hidden">
          <p class="hint" id="ovSent"></p>
          <input id="ovCode" type="tel" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="text-align:center;letter-spacing:6px;font-size:22px">
          <button class="btn block" id="ovGoBtn" type="button" style="margin-top:8px"></button>
        </div>
        <button class="btn block ghost" id="confirmCancel" type="button"></button>
      </div>

      <p class="hint" id="orType" style="margin-top:22px"></p>
      <label class="label" id="lPhone" for="phone"></label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="3055551234">
      <p class="hint" id="phoneHint"></p>

      <button class="btn block" id="submit"></button>
      <p class="hint" id="weekNote"></p>
      <div class="msg hidden" id="msg"></div>
    </div>

    <div id="done" class="hidden">
      <h1 id="doneH" style="font-size:24px"></h1>
      <p class="hint" id="doneSub"></p>
      <div class="stamps" id="doneStamps"></div>
      <p class="hint" id="doneReward"></p>
      <button class="btn block" id="again"></button>
    </div>
  </div>
  <p class="foot" id="foot"></p>
</main>

<script src="staff.js"></script>
<script src="owner-nav.js"></script>
</body>
</html>
