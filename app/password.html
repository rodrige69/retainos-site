<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set your password · RetainOS</title>
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script src="sb.js"></script>
</head>
<body>
<header class="top">
  <a class="logo" href="signin.html">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M79.34 43.76 A30 30 0 1 1 45.82 20.29" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/><path d="M60.68 18.20 L44.15 8.41 L47.49 32.18 Z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="72.98" cy="30.72" r="11" fill="currentColor"/></svg>
    <span>Retain<b>OS</b></span>
  </a>
  <div class="lang" role="group" aria-label="Language">
    <button id="btnEn" aria-pressed="true">EN</button><button id="btnEs" aria-pressed="false">ES</button>
  </div>
</header>

<main class="wrap narrow">
  <div class="card">
    <h1 id="h1" style="font-size:26px"></h1>
    <p class="hint" id="sub"></p>

    <div id="formBlock">
      <label class="label" id="lPw" for="pw"></label>
      <input id="pw" type="password" autocomplete="new-password" placeholder="••••••••">

      <label class="label" id="lPw2" for="pw2"></label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="••••••••">

      <button class="btn block" id="save"></button>
    </div>

    <div class="msg hidden" id="msg"></div>
    <a class="btn ghost block hidden" id="go" href="dashboard.html"></a>
    <a class="btn ghost block hidden" id="toSignin" href="signin.html"></a>
  </div>
  <p class="foot" id="foot"></p>
</main>
<script src="password.js"></script>
</body>
</html>
